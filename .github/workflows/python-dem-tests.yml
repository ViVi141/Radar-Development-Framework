# Minimal CI for RDF offline Python helpers (tools/dem).
# Covers ballistics + CFAR + track golden unit tests (Sprint D).

name: Python DEM tests

on:
  push:
    paths:
      - "tools/dem/**"
      - ".github/workflows/python-dem-tests.yml"
  pull_request:
    paths:
      - "tools/dem/**"
      - ".github/workflows/python-dem-tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/dem
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install numpy
        run: pip install "numpy>=1.24"

      - name: Run golden unit tests
        run: python -m unittest discover -s . -p "test_rdf_*.py" -v
